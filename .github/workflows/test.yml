name: Test

on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Test and assemble debug APK
        env:
          TZ: Asia/Shanghai
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify LSPosed 102 package metadata
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'targetApiVersion=102'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fx 'autoHotReload=true'
          unzip -p "$APK" META-INF/xposed/java_init.list             | grep -Fx 'io.github.miam1ku.mibandoplusbridge.hook.EntryPoint'
          if unzip -Z1 "$APK" | grep -Fx 'assets/xposed_init'; then
            echo "legacy xposed_init must not be packaged" >&2
            exit 1
          fi
      - name: Reject root-shell and legacy Xposed regressions
        run: |
          set -euo pipefail
          if grep -R -n -E 'ProcessBuilder\("su"|pm disable-user|cmd deviceidle|rootStart\(|probeRoot\(' \
              app/src/main/java app/src/test/java 2>/dev/null; then
            echo "root-shell compatibility path reintroduced" >&2
            exit 1
          fi
          if grep -R -n -E '^[[:space:]]*import[[:space:]]+de\.robv\.android\.xposed' \
              app/src/main/java 2>/dev/null \
              || grep -n 'de\.robv\.android\.xposed:api' app/build.gradle; then
            echo "legacy Xposed runtime API reintroduced" >&2
            exit 1
          fi
